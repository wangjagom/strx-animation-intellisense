name: Release

# Push a version tag (for example `git tag v0.3.0 && git push origin v0.3.0`),
# or run this workflow from the Actions tab, to test, package, and publish
# the extension. A pushed tag must match the `version` in package.json; a
# manual run tags the current commit with that version.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve release tag
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "${tag}" ]; then
              echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected ${tag})."
              exit 1
            fi
          elif [ "${GITHUB_REF}" != "refs/heads/main" ]; then
            echo "::error::Run the Release workflow on main (got ${GITHUB_REF})."
            exit 1
          elif git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null; then
            echo "::error::${tag} already exists. Bump the version in package.json before releasing again."
            exit 1
          fi
          echo "RELEASE_TAG=${tag}" >> "$GITHUB_ENV"

      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: xvfb-run -a npm test
      - run: npx vsce package --out extension.vsix

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Add a VSCE_PAT repository secret to publish to the Visual Studio Marketplace."
            exit 1
          fi
          npx vsce publish --packagePath extension.vsix

      # Cursor and other VS Code-based editors install from Open VSX.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::No OVSX_PAT secret; skipping Open VSX."
            exit 0
          fi
          npx --yes ovsx@1.2.0 publish extension.vsix

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${RELEASE_TAG}" extension.vsix \
            --target "${GITHUB_SHA}" \
            --title "${RELEASE_TAG}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${RELEASE_TAG}/CHANGELOG.md)."
