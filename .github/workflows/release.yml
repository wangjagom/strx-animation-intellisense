name: Release

# Push a version tag (for example `git tag v0.3.0 && git push origin v0.3.0`)
# to test, package, and publish the extension. The tag must match the
# `version` in package.json.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package.json version ${version} (expected v${version})."
            exit 1
          fi

      - run: npm ci
      - run: npm run lint
      - run: npm run test:unit
      - run: xvfb-run -a npm test
      - run: npx vsce package --out extension.vsix

      - name: Publish to Visual Studio Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "::error::Add a VSCE_PAT repository secret to publish to the Visual Studio Marketplace."
            exit 1
          fi
          npx vsce publish --packagePath extension.vsix

      # Cursor and other VS Code-based editors install from Open VSX.
      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          if [ -z "$OVSX_PAT" ]; then
            echo "::notice::No OVSX_PAT secret; skipping Open VSX."
            exit 0
          fi
          npx --yes ovsx@1.2.0 publish extension.vsix

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" extension.vsix \
            --title "${GITHUB_REF_NAME}" \
            --notes "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_REF_NAME}/CHANGELOG.md)."
